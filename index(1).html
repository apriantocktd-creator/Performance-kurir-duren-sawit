function star(s){let n=parseInt(s)||0;return '★'.repeat(n)+'☆'.repeat(5-n)}function metric(l,v,a=false){return `<div class="metric ${a?'alert':''}"><span>${l}</span><b>${v}</b></div>`}
function card(r){return `<article class="card"><div class="profile"><div><h2>${esc(r['Driver Name'])}</h2><div class="meta">WFM ID · ${esc(r['WFM ID'])}<br>${esc(r['Vendor Name'])}</div></div><div class="score"><strong>${num(r['Final Score'])}</strong><small>Final Score</small><div class="stars">${star(r['Star Rating'])}</div></div></div><div class="metrics">${metric('ADO Picked',num(r['ADO Picked']))}${metric('ADO Delivered',num(r['ADO Delivered']))}${metric('Productivity',num(r.Productivity))}${metric('Attendance',num(r.Attendance,0))}${metric('On-time Attendance',pct(r['On-time Attendance %']))}${metric('Fresh Success',pct(r['Fresh Success Delivered %']))}${metric('COT1 <12PM',pct(r['Success Delivered <12PM % (COT1)']))}${metric('LM POD Valid',pct(r['LM POD Valid %']))}${metric('POFD Valid',pct(r['POFD Valid %']))}${metric('DNR',num(r.DNR,0),Number(r.DNR)>0)}${metric('Lost Parcels',num(r['Lost Parcels'],0),Number(r['Lost Parcels'])>0)}${metric('COD Late D+1',pct(r['COD Settled Late D+1 %']),Number(r['COD Settled Late D+1 %'])>0)}</div><div class="identity"><span class="tag">${esc(r['Driver Category'])}</span><span class="tag">${esc(r['LM Courier Cycle'])}</span><span class="tag">Tenure ${num(r['Courier Tenure'],2)} tahun</span><span class="tag">Lost ${pct(r['Lost %'])}</span><span class="tag">DNR ${pct(r['DNR %'])}</span></div></article>`}
let timer;async function render(){clearTimeout(timer);const id=$('#search').value.trim();$('#clear').style.visibility=id?'visible':'hidden';if(!id){$('#results').hidden=true;$('#welcome').hidden=false;return}timer=setTimeout(async()=>{const found=await unlock(id);$('#welcome').hidden=true;$('#results').hidden=false;$('#count').textContent=found?`${found.length} performance ditemukan`:'WFM ID tidak ditemukan';$('#cards').innerHTML=found?found.map(card).join(''):'<div class="empty">WFM ID tidak cocok. Periksa kembali ID lengkap Anda.</div>'},250)}
